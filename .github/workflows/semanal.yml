name: Datos del MAPA (cada día)

on:
  schedule:
    # Cada día a las 05:00 UTC (7:00 en España en verano, 6:00 en invierno). El MAPA no dice
    # cuándo actualiza; solo se publica si cambia la fecha de sus datos.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      forzar_fallo:
        description: 'Prueba: hacer fallar la comprobación (no publica y avisa por correo)'
        type: boolean
        default: false
      republicar:
        description: 'Volver a publicar la fecha ya publicada (sustituye su Release; solo si el MAPA no tiene datos nuevos)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency: datos

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Descargar el JSON del MAPA
        run: node tool/datos/descargar.ts mapa.json

      - name: Convertir a SQLite
        run: node tool/datos/convertir.ts mapa.json sulfata.db

      - name: Comprimir
        run: gzip -9 -k sulfata.db

      - name: Comprobar
        id: comprobar
        # shell: bash activa pipefail: si comprobar.ts falla, el paso falla aunque pase por tee.
        shell: bash
        env:
          FORZAR_FALLO: ${{ inputs.forzar_fallo || 'false' }}
        run: |
          node tool/datos/comprobar.ts sulfata.db sulfata.db.gz version.json \
            "https://github.com/${{ github.repository }}/releases/latest/download/version.json" | tee salida.txt
          echo "resultado=$(tail -n 1 salida.txt)" >> "$GITHUB_OUTPUT"

      - name: Publicar
        if: steps.comprobar.outputs.resultado == 'publicar' || (inputs.republicar && steps.comprobar.outputs.resultado == 'sin-cambios')
        env:
          GH_TOKEN: ${{ github.token }}
          REPUBLICAR: ${{ inputs.republicar && steps.comprobar.outputs.resultado == 'sin-cambios' }}
        run: |
          FECHA=$(node -p "require('./version.json').fecha_datos")
          # Volver a publicar la misma fecha (por ejemplo, tras cambiar el conversor): se quita antes
          # la Release de esa fecha. Solo a mano, y solo si el MAPA no ha publicado nada nuevo.
          if [ "$REPUBLICAR" = "true" ]; then
            gh release delete "datos-$FECHA" --yes --cleanup-tag
          fi
          gh release create "datos-$FECHA" sulfata.db.gz version.json \
            --title "Datos del $FECHA" --latest \
            --notes "Registro de Productos Fitosanitarios del MAPA con fecha $FECHA, convertido a SQLite. Fuente: Ministerio de Agricultura, Pesca y Alimentación (https://servicio.mapa.gob.es/regfiweb). No afiliado al MAPA."

      - name: Sin cambios
        if: steps.comprobar.outputs.resultado == 'sin-cambios' && !inputs.republicar
        run: echo "El MAPA no ha publicado datos nuevos; no se publica nada."
